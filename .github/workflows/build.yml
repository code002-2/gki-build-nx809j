name: Build android16-6.12 GKI + KernelSU/SUSFS

on:
  workflow_dispatch:
    inputs:
      patch_level:
        description: "安全补丁级别 (auto=最新月度发布, tip=分支头, lts=LTS, 或指定月份如 2026-09)"
        type: choice
        default: auto
        options:
          - auto
          - tip
          - lts
          - 2026-09
          - 2026-06
          - 2026-03
          - 2025-12
          - 2025-09
          - 2025-08
          - 2025-07
      kernelsu_variant:
        description: "KernelSU 变体 (SukiSU 最新版不兼容 6.12)"
        type: choice
        default: Official
        options:
          - Official
          - ReSukiSU
          - SukiSU
          - Next
      version_name:
        description: "自定义版本名 (可选)"
        type: string
        default: ""
      build_time:
        description: "自定义构建时间 (可选, N或留空=当前UTC, 如 Sun Dec 01 08:10:00 UTC 2024)"
        type: string
        default: ""
      use_kpm:
        description: "KPM 功能 (patched 尚不支持, 仅 SukiSU/ReSukiSU/Next 变体)"
        type: choice
        default: disabled
        options:
          - disabled
          - enabled
          - patched
      droidspaces:
        description: "Droidspaces 容器支持 (开/关)"
        type: boolean
        default: false
      artifact_upload_mode:
        description: "构建产物上传模式"
        type: choice
        default: "上传全部"
        options:
          - "仅上传 AnyKernel3.zip"
          - "上传全部"
      droidspaces_ntsync:
        description: "启用 Droidspaces 容器 NTSync 支持 (需 Droidspaces 开启)"
        type: boolean
        default: false
      use_zram:
        description: "启用 ZRAM 增强算法 (6.12 上游未适配, 选择后自动跳过)"
        type: boolean
        default: false
      use_bbg:
        description: "启用 BBG 防格机"
        type: boolean
        default: false
      use_rekernel:
        description: "启用 Re-Kernel 驱动"
        type: boolean
        default: false
      cve_2026_43499_patch:
        description: "应用 CVE-2026-43499 rtmutex 修复链"
        type: boolean
        default: false
      cancel_susfs:
        description: "禁用 SUSFS"
        type: boolean
        default: false
      supp_op:
        description: "启用一加 8E 支持"
        type: boolean
        default: false
      retention_days:
        description: "产物保留天数"
        type: number
        default: 14

  # 每周日自动构建一次最新版本
  schedule:
    - cron: "35 20 * * 0"

concurrency:
  group: gki-612-build
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: 安装基础工具
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zip unzip python3 python-is-python3

      - name: 构建内核(自动识别最新 6.12 版本)
        run: |
          bash build.sh \
            --patch-level  "${{ github.event.inputs.patch_level || 'auto' }}" \
            --variant      "${{ github.event.inputs.kernelsu_variant || 'Official' }}" \
            --version-name "${{ github.event.inputs.version_name || '' }}" \
            --build-time   "${{ github.event.inputs.build_time || '' }}" \
            --kpm          "${{ github.event.inputs.use_kpm || 'disabled' }}" \
            --droidspaces  "${{ (github.event.inputs.droidspaces || 'false') == 'true' && 'on' || 'off' }}" \
            --ntsync       "${{ (github.event.inputs.droidspaces_ntsync || 'false') == 'true' && 'on' || 'off' }}" \
            --artifact-mode "${{ github.event.inputs.artifact_upload_mode == '仅上传 AnyKernel3.zip' && 'anykernel3' || 'all' }}" \
            --zram         "${{ (github.event.inputs.use_zram || 'false') == 'true' && 'on' || 'off' }}" \
            --bbg          "${{ (github.event.inputs.use_bbg || 'false') == 'true' && 'on' || 'off' }}" \
            --re-kernel    "${{ (github.event.inputs.use_rekernel || 'false') == 'true' && 'on' || 'off' }}" \
            --cve          "${{ (github.event.inputs.cve_2026_43499_patch || 'false') == 'true' && 'on' || 'off' }}" \
            --oneplus      "${{ (github.event.inputs.supp_op || 'false') == 'true' && 'on' || 'off' }}" \
            --susfs        "${{ (github.event.inputs.cancel_susfs || 'false') == 'true' && 'off' || 'on' }}" \
            --mirror google --slim on

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: gki-6.12-${{ github.run_number }}
          path: work/out/
          if-no-files-found: error
          retention-days: ${{ github.event.inputs.retention_days || 14 }}
